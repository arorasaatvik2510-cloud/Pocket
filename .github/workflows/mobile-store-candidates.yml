name: Pocketwise mobile candidates

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "package.json"
      - "src/**"
      - "capacitor.config.ts"
      - "vite.config.ts"
      - ".github/workflows/mobile-store-candidates.yml"

permissions:
  contents: read

concurrency:
  group: pocketwise-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK and AAB candidates (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Install dependencies
        run: npm install
      - name: Build the web app
        run: npm run build
      - name: Generate and sync Android app
        run: |
          npx cap add android
          npx cap sync android
      - name: Verify target API 36
        run: |
          grep -R -E 'targetSdkVersion[[:space:]]*=[[:space:]]*36|targetSdk[[:space:]]*=[[:space:]]*36' android
          test -d "$ANDROID_HOME/platforms/android-36"
      - name: Build APK and Android App Bundle candidates
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: pocketwise-android-candidates-unsigned
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    name: iOS Simulator smoke build (unsigned)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build the web app
        run: npm run build
      - name: Generate and sync iOS app
        run: |
          npx cap add ios
          npx cap sync ios
      - name: Build iOS Simulator app
        run: |
          PROJECT_PATH="$(find ios/App -maxdepth 1 -name '*.xcodeproj' -print -quit)"
          test -n "$PROJECT_PATH"
          xcodebuild -project "$PROJECT_PATH" -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO -derivedDataPath "$RUNNER_TEMP/PocketwiseDerivedData" build
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/PocketwiseDerivedData/Build/Products/Debug-iphonesimulator/App.app" "$RUNNER_TEMP/Pocketwise-iOS-Simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: pocketwise-ios-simulator-unsigned
          path: ${{ runner.temp }}/Pocketwise-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14

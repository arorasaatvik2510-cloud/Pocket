name: Publish Pocketwise Beta

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "postcss.config.js"
      - "tailwind.config.js"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Pocketwise
        run: npm run build
      - name: Upload production site
        uses: actions/upload-pages-artifact@v5
        with:
          path: "dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
